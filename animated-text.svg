<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 60" width="440" height="60">
  <style>
    .text {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 40px;
      font-weight: 550;
      dominant-baseline: middle;
      text-anchor: middle;
      opacity: 0;
      animation: cycle 12s infinite;
    }
    
    /* Assigning colors and staggering the start times */
    .w1 { fill: #22b289; animation-delay: 0s; }
    .w2 { fill: #3b82f6; animation-delay: 2s; }
    .w3 { fill: #ef4444; animation-delay: 4.5s; }
    .w4 { fill: #f59e0b; animation-delay: 7s; }
    .w5 { fill: #8b5cf6; animation-delay: 9.5s; }

    /* The animation logic */
    @keyframes cycle {
      0%, 2% { opacity: 0; transform: translateY(5px); }
      5%, 15% { opacity: 1; transform: translateY(0); }
      18%, 100% { opacity: 0; transform: translateY(-5px); }
    }

    /* Border styling */
    .border-box {
      fill: none;
      stroke: #7d8590; /* Neutral grey */
      stroke-width: 1px; /* Thinner border */
    }
  </style>

  <rect x="0.5" y="0.5" width="439" height="59" class="border-box" />

  <text x="220" y="30" class="text w1">Aerospace</text>
  <text x="220" y="30" class="text w2">CFD</text>
  <text x="220" y="30" class="text w3">Systems &amp; Control</text>
  <text x="220" y="30" class="text w4">Mechanical</text>
  <text x="220" y="30" class="text w5">Process</text>
</svg>
